[project]
name = "nexora"
version = "0.1.0"
description = "Plataforma de agentes de IA model-agnostica"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nexora = "nexora.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
